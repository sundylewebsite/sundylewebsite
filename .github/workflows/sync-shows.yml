# Refreshes the Live dates on the website from the band calendar.
#
# Needs one thing from you: the public ICS link pasted into data/calendar.js.
# Until that is done this job exits quietly and changes nothing.
#
# Runs daily (GitHub's scheduler can be 15-60 minutes late under load) and can
# be kicked off by hand from the Actions tab → "Sync show dates" → Run workflow.
name: Sync show dates

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/calendar.js"
      - "scripts/sync-shows.py"

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the calendar
        run: python3 scripts/sync-shows.py

      - name: Commit the dates if anything changed
        id: commit
        run: |
          if git diff --quiet -- data/shows.generated.js; then
            echo "No change in the dates."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shows.generated.js
          git commit -m "Sync show dates from the band calendar"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default token does NOT trigger a Pages build, so
      # without this the live site would keep showing the previous dates. And a
      # build that FAILS says nothing anywhere — the site just stays stale — so
      # ask, check, and ask again rather than assuming.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          head=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
            for i in $(seq 1 15); do
              sleep 6
              out=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
                    --jq '"\(.status) \(.commit)"')
              status=${out%% *}
              commit=${out##* }
              [ "${commit:0:7}" = "${head:0:7}" ] || continue
              case "$status" in
                built)   echo "site rebuilt for $head"; exit 0 ;;
                errored) echo "attempt $attempt: build errored, retrying"; break ;;
              esac
            done
          done
          echo "::error::Pages never reported a successful build for $head — the live site may be showing the previous dates"
          exit 1
